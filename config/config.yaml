design:
  cost_penalty:
    # North_West_Africa: 1.1 # Relative cost pentalty on all technlogies in this region. 1: no change
    # Eurasia: 1.1
    # South_America: 0.7
    # Oceania: 0.8

techno-economic parameters:
  pypsa_tech_version: v0.14.0
  eur_usd: 1.15 # 1 Euro equals 1.15 USD
  additional_parameters:
    h2_standing_loss: 0.001  # 0.1% per hour for underground cavern (leakage)
    batt_standing_loss: 0.0001  # 0.01% per hour for battery (self-discharge)

interest_rate: 
  default: 0.05
  # Regional discount rates (override default for specific regions):
  Central_America: 0.11
  East_Asia: 0.09
  East_East_Asia: 0.08
  Eurasia: 0.10
  Europe: 0.10
  Far_West_Europe: 0.08
  Middle_East: 0.12
  North_America: 0.08
  North_West_Africa: 0.12
  Oceania: 0.07
  Pacific_Asia: 0.10
  South_America: 0.11
  South_South_America: 0.10
  Subsaharan_Africa: 0.11
  West_Asia: 0.11

trade:
  shipping_routes:
    ports: "predefined"  # "closest": route from region centroid (searoute snaps to nearest sea node); "predefined": route from hand-curated port city coordinates parsed from the notes column in trade_opt.csv
  diversity_factor: False # "False" or float as max constraint for one single hbi supply route in the trade model. 1: no limit, 0.5: max 50% of demand can be supplied by one single supply route, etc.
  # Note: The diversity factor constraints the trade route, not the producer itself. (Import from exporter route R <= diversity_factor * demand of importer I.). As a result, if the trade passes through one region, it is limited based on the demand of this particular region * diversity_factor. Therefore the trade routes in a scenario with a diversity_factor of 100% may differ to a scenario where diversity_factor=False.
  
grid_electricity:
  marginal_cost: 80 # EUR/MWh, guesstimate for average grid electricity cost in 2030
  capital_cost: 0 # EUR/MW, guesstimate for average grid electricity cost in 2030
  grid_potential_custom: true # Use custom grid potential for eaf-grid from data/grid_potential_custom.csv in Mt steel

part_load:
  electrolysis: 0.0
  direct reduction furnace: 0.9
  electric arc furnace: 0.0
  # add part load limitations by naming the carrier of links

iron_ore:
  regionalise: "grade-dependent" #"uniform" or "grade-dependent"
  marginal_cost: 97.7 #97.7 # EUR/t_ore # See https://www.nature.com/articles/s41467-025-60652-1 from mission possible steel model (see also technology-data)
  ore_to_steel_ratio: 1.59 # t_ore/t_steel, see https://www.nature.com/articles/s41467-025-60652-1 from mission possible steel model (see also technology-data)
  potential_allowance: 2 # Factor, which the current iron ore production is multiplied with
  shipping_cost_per_km: 0.005 # €/(t*km) # Guesstimate

plot:
  world_map:
    hydrogen:
      bus_size: 1.0e-8
      link_width: 1.0e-9
    iron_ore:
      bus_size: 2.0e-7
      link_width: 3.0e-8
    hbi:
      bus_size: 2.0e-7
      link_width: 3.0e-8
    steel:
      bus_size: 2.0e-7
      link_width: 3.0e-8
solver:
  name: gurobi
  options: gurobi-default
  compute_iis: False  # Set to false to skip expensive IIS computation for infeasible models
solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 4
      solver: "ipm"
      run_crossover: "on"
      small_matrix_value: 1e-6
      large_matrix_value: 1e15
      primal_feasibility_tolerance: 1e-6
      dual_feasibility_tolerance: 1e-6
      ipm_optimality_tolerance: 1e-6
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 4
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-6 # 1.e-5?
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200


