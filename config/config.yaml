enable:
  run_supply_chain: True # Enable for first run
  run_supply_curve: True # Enable for first run


# Output toggles for Step 0/1 (greenfield supply curve generation)
outputs:
  save_supply_nodemand: True  # Generate reference supply curve (all generators available) alongside main curve
  keep_optimization_networks: False  # Keep .nc network files from optimization (set False to save disk space)


# Absolute steel demand levels (Mt/year) for supply curve sweep
# For each level, PyPSA minimizes cost with fixed renewable capacity
# Values represent different production scales
steel_demand_levels: [10, 200, 1000]  # Mt/year
hydrogen_storage_cost: False
iron_ore_cost_in_supply_chain: False # Should be set to false, since iron ore cost will be added in the transport model and should not be double counted

run:
  # prefix: ""
  # name: ""
  # scenarios:
  #   enable: false
  #   file: config/scenarios.yaml
  disable_progressbar: false

# Region definitions (ISO3 codes matching renewable clusters metadata)
regions:
  "Europe": ["DEU", "FRA", "GBR", "ITA", "ESP", "POL", "NLD", "BEL", "SWE", "NOR"]
  "Africa_West": ["SEN", "GMB", "GIN", "SLE"]          # Senegal, Gambia, Guinea, Sierra Leone
  "Africa_Central": ["GNQ", "GAB", "CMR", "CAF"]       # Equatorial Guinea, Gabon, Cameroon, Central African Republic
  "Africa_East": ["KEN", "UGA", "RWA", "ETH"]          # Kenya, Uganda, Rwanda, Ethiopia

# countries: [
