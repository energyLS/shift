enable:
  run_supply_chain: False # Enable for first run
  run_supply_curve: False # Enable for first run
  cluster_renewables: False # Enable for first run


# Output toggles for Step 0/1 (greenfield supply curve generation)
outputs:
  save_supply_nodemand: True  # Generate reference supply curve (all generators available) alongside main curve
  keep_optimization_networks: True  # Keep .nc network files from optimization (set False to save disk space)

# Supply curve scenario configuration
# Three scenarios are supported:
#   - allocated_share (DEFAULT): each renewable generator available at X of nominal capacity,
#     where X is the allocation_factor (0 < X < 1). Simulates grid-constrained or partially
#     dedicated renewable infrastructure.
#   - reserved: highest-performing (best CF) renewable generators reserved for domestic
#     electricity demand; export/HBI supply stack reduced before optimization. Requires electricity demand data.
#   - unreserved (FALLBACK): no domestic reservation; full renewable stack available.
#     Can be generated without electricity demand data when demand data unavailable.
supply_curve:
  generate_unreserved: False  # Set to True to generate unreserved scenario as fallback
  default_scenario: allocated_share  # Default scenario for supply curve generation
  allocation_factor: 0.3  # Renewable capacity allocation factor for allocated_share scenario (0 < X <= 1)


# Config-native trade chain definitions
# Defines the commodity transformation chain with ordered stages and process labels
trade_chains:
  id: supplyconstraint
  cost_year: 2050
  final_product: steel
  wacc: regional #regional
  labour_cost: True #Include labour cost
  tradeable_commodities: [iron_ore, hbi]
  stages:
    1:
      material_inputs: []
      energy_inputs: [renewable_electricity]
      output_commodity: hydrogen
      process_label: electrolysis
    2:
      material_inputs: [iron_ore, hydrogen]
      energy_inputs: [renewable_electricity]
      output_commodity: hbi
      process_label: dri
    3:
      material_inputs: [hbi]
      energy_inputs: [grid_electricity]
      output_commodity: steel
      process_label: eaf
  trade_scenarios:
    # - default
    # - mga-stability-weighted
    - mga-chokepoints
    - mga-blocs
    - constrain-supply


scenario: 
  default:
    modifiers:
      cost_penalty:
  penalty-nwa:
    modifiers:
      cost_penalty:
        North_West_Africa: 1.1
  penalty-ea:
    modifiers:
      cost_penalty:
        Eurasia: 1.1
  penalty-sa:
    modifiers:
      cost_penalty:
        South_America: 0.7
  penalty-oc:
    modifiers:
      cost_penalty:
        Oceania: 0.8
  mga-eur-nwa-2:
    modifiers:
      cost_penalty:
      mga:
        slack: 0.002
        sense: "min"
        carrier: "hbi"
        export: "North_West_Africa"
        import: "Europe"
  mga-nwa-iso:
    modifiers:
      cost_penalty:
      mga:
        slack: 0.01
        sense: "min"
        carrier: "hbi"
        export: "North_West_Africa"
  mga-stability:
    modifiers:
      cost_penalty:
      mga:
        slack: [0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.025, 0.03]
        sense: "min"
        carrier: "hbi"
        indicator: "stability"
        threshold_value: -0.5 # Regions with stability index below -0.5
  mga-stability-weighted:
    modifiers:
      cost_penalty:
      mga:
        slack: [0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.025, 0.03]
        sense: "min"
        carrier: "hbi"
        indicator: "stability"
        threshold_value: -0.5 # Regions with stability index below -0.5
        weighting: # Use `workflow/notebooks/utility-weighted-mga.ipynb` to define the weights based on the political stability index, if desired
          Middle_East: 1.00
          North_West_Africa: 0.93
          Subsaharan_Africa: 0.81
          West_Asia: 0.76
          Eurasia: 0.65
          South_America: 0.55
  mga-chokepoints:
    modifiers:
      cost_penalty:
      mga:
        slack: [0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.025, 0.03]
        sense: "min"
        carrier: "hbi"
        indicator: "chokepoint"
        threshold_value: ["babalmandab", "bosporus", "gibraltar", "suez", "panama", "ormuz", "malacca", "south_africa"] # Primary chokepoints according to https://porteconomicsmanagement.org/pemp/contents/part1/interoceanic-passages/main-maritime-shipping-routes/  # Secondary chokepoints: ["northwest", "sunda", "chili"], Primary chokepoints not in searoutes: ["Oresund"]
  mga-blocs:
    modifiers:
      cost_penalty:
      mga:
        slack: [0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.025, 0.03] #[0.005, 0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05] 
        sense: "min"
        carrier: "hbi"
        indicator: "blocks"
        threshold_value: 
          # Used "definition_C" from config/blocs_traceregions.yaml
          block_1: ["Europe", "Far_West_Europe", "North_America"]
          block_2: ["Middle_East", "North_West_Africa", "Subsaharan_Africa", "Eurasia", "South_America", "South_South_America", "Central_America", "West_Asia", "East_Asia", "Pacific_Asia"]
          block_3: ["East_East_Asia", "Oceania"]
  constrain-supply:
      modifiers:
        cost_penalty:
        pareto:
          indicator: "supply"
          threshold_value: [50, 100, 200, 300, 400] # Mt



# Absolute steel demand levels (Mt/year) for supply curve sweep
# For each level, PyPSA minimizes cost with fixed renewable capacity
# Values represent different production scales
steel_demand_levels: [0.1, 0.5, 1, 5, 10, 25, 50, 75, 100, 200, 300, 500, 1000] # Mt/year
hydrogen_storage_cost: False

electricity_steel_ratio: 5.25 #TWh/Mt or MWh/t, see notebooks 'analysis-steel.ipynb'
embodied_energy_steel: 2.1 #TWh/Mt or MWh/t, see iron oxide reduction

run:
  # prefix: ""
  # name: ""
  # scenarios:
  #   enable: false
  #   file: config/scenarios.yaml
  disable_progressbar: false

# Region definitions (ISO3 codes matching renewable clusters metadata)
regions:
