enable:
  run_supply_chain: True # Enable for first run
  run_supply_curve: True # Enable for first run


# Absolute steel demand levels (Mt/year) for supply curve sweep
# For each level, PyPSA minimizes cost with fixed renewable capacity
# Values represent different production scales
steel_demand_levels: [10, 200, 1000]  # Mt/year
hydrogen_storage_cost: False
iron_ore_cost_in_supply_chain: False # Should be set to false, since iron ore cost will be added in the transport model and should not be double counted

run:
  # prefix: ""
  # name: ""
  # scenarios:
  #   enable: false
  #   file: config/scenarios.yaml
  disable_progressbar: false

# Region definitions (ISO3 codes matching renewable clusters metadata)
regions:
  "Test_1": ["NLD"]
  "Test_2": ["PRT"]
  "Test_3": ["IRL"]

scenario: # must be listed in config/trade_scenarios.csv in order to run
  default:

design:
  cost_penalty:
    # North_West_Africa: 1.1 # Relative cost pentalty on all technlogies in this region. 1: no change
    # Eurasia: 1.1
    # South_America: 0.7
    # Oceania: 0.8

costs:
  version: v0.14.0

interest_rate: 
  default: 0.05
  "Test_1": 0.05
  "Test_2": 0.06
  

part_load:
  electrolysis: 0.0
  direct reduction furnace: 0.9
  electric arc furnace: 0.0
  # add part load limitations by naming the carrier of links

electricity_steel_ratio: 5.25 #TWh/Mt or MWh/t, see notebooks 'analysis-steel.ipynb'
embodied_energy_steel: 2.1 #TWh/Mt or MWh/t, see iron oxide reduction
pv_p_nom_max_cor: 0.1
onwind_p_nom_max_cor: 0.1

iron_ore:
  marginal_cost: 97.7 #97.7 # EUR/t_ore # See https://www.nature.com/articles/s41467-025-60652-1 from mission possible steel model (see also technology-data)
  ore_to_steel_ratio: 1.59 # t_ore/t_steel, see https://www.nature.com/articles/s41467-025-60652-1 from mission possible steel model (see also technology-data)
  potential_allowance: 1.2 # Factor, which the current iron ore production is multiplied with
  shipping_cost_per_km: 0.005 # €/(t*km) # Guesstimate

plot:
  world_map:
    hydrogen:
      bus_size: 1.0e-8
      link_width: 1.0e-9
    iron_ore:
      bus_size: 1.0e-7
      link_width: 1.5e-8
    hbi:
      bus_size: 1.0e-7
      link_width: 1.5e-8
    steel:
      bus_size: 1.0e-7
      link_width: 1.5e-8

solver:
  name: gurobi
  options: gurobi-default
  compute_iis: False  # Set to false to skip expensive IIS computation for infeasible models
solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 4
      solver: "ipm"
      run_crossover: "on"
      small_matrix_value: 1e-6
      large_matrix_value: 1e15
      primal_feasibility_tolerance: 1e-6
      dual_feasibility_tolerance: 1e-6
      ipm_optimality_tolerance: 1e-6
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 4
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-6 # 1.e-5?
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200


colors:
  electric arc furnace: 'orange'
  direct reduction furnace: 'grey'
  electrolysis: 'magenta'
  battery inverter (charging): '#6A000E'
  battery inverter (discharging): '#FF5733'
  battery: 'purple'
  wind: 'blue'
  solar: 'yellow'
  pv: 'yellow'
  electricity: 'red'
  iron ore: 'brown'
  steel: 'grey'
  hot briquetted iron: 'darkred'
  hydrogen: 'magenta'
  Battery: purple
  Electricity: red
  HBI: darkred
  Photovoltaics: yellow
  Wind energy: blue
  Eurasia:              '#1B4F9C'  # deep blue
  Europe:               '#F39C12'  # strong orange
  Far_West_Europe:      '#2ECC71'  # vivid green
  Middle_East:          '#C0392B'  # brick red
  North_West_Africa:    '#7D3C98'  # dark purple
  Subsaharan_Africa:    '#A04000'  # burnt sienna
  North_America:        '#F1C40F'  # yellow (clearly distinct)
  South_America:        '#16A085'  # teal
  South_South_America:  '#EC7063'  # coral
  Central_America:      '#27AE60'  # emerald (different from teal)
  West_Asia:            '#2C3E50'  # blue-grey (almost navy)
  East_Asia:            '#58D68D'  # light green (intentional contrast)
  Pacific_Asia:         '#AF7AC5'  # lavender
  East_East_Asia:       '#922B21'  # dark red
  Oceania:              '#1F618D'  # steel blue
